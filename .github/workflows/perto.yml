name: Perto de você
# Pega a base do mês (release base-AAAA-MM), põe coordenada em cada empresa com os endereços do IBGE (CNEFE)
# e publica em pedaços pequenos do mapa, um release por estado (perto-UF). O sistema da AMELIE lê só os pedaços
# da região onde o representante está. Roda sozinho quando a base do mês termina.
on:
  workflow_run:
    workflows: ['Base de CNPJ']
    types: [completed]
  schedule:
    - cron: '47 13 * * *'    # 10:47 em Brasília: pega o que a base do dia tiver deixado
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Gerar de novo mesmo sem base nova'
        type: boolean
        default: false
      ufs:
        description: 'Só estes estados (ex.: SP,MG). Vazio = todos'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: perto
  cancel-in-progress: false
jobs:
  perto:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Testes
        run: python3 teste_perto.py
      - name: Precisa gerar?
        id: conf
        run: |
          curl -sSL --fail -o base.json "https://github.com/$REPO/releases/latest/download/manifesto.json" || echo '{}' > base.json
          curl -sSL --fail -o atual.json "https://github.com/$REPO/releases/download/perto/perto.json" || echo '{}' > atual.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          b = json.load(open('base.json')); a = json.load(open('atual.json'))
          import perto
          tem = bool(b.get('id')) and not b.get('teste')
          precisa = tem and not (a.get('id') == b.get('id') and a.get('formato') == perto.FORMATO)
          print('precisa=' + ('sim' if precisa else 'nao')); print('mes=' + str(b.get('mes', '')))
          PY
          cat "$GITHUB_OUTPUT"
      - name: Baixar a base do mês
        if: steps.conf.outputs.precisa == 'sim' || (inputs.forcar && steps.conf.outputs.mes != '')
        run: |
          mkdir -p saida
          gh release download "base-${{ steps.conf.outputs.mes }}" -R "$REPO" -D saida -p 'estab-*.tsv.gz' -p manifesto.json
          ls -la saida | head -40
      - name: Localizar e dividir
        if: steps.conf.outputs.precisa == 'sim' || (inputs.forcar && steps.conf.outputs.mes != '')
        run: python3 perto.py --ufs "${{ inputs.ufs }}"
      - name: Publicar
        if: steps.conf.outputs.precisa == 'sim' || (inputs.forcar && steps.conf.outputs.mes != '')
        run: bash publicar_perto.sh "${{ steps.conf.outputs.mes }}" "${{ inputs.ufs }}"

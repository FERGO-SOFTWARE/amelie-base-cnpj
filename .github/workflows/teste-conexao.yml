name: Teste de conexão
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Receita - listagem
        run: |
          curl -sS -m 60 -u 'YggdBLfdninEJX9:' -X PROPFIND -H 'Depth: 1' https://arquivos.receitafederal.gov.br/public.php/webdav/ -o lista.xml -w '::notice::listagem HTTP %{http_code} em %{time_total}s\n' || true
          echo "::notice::meses $(grep -o '[0-9]\{4\}-[0-9]\{2\}' lista.xml | sort -u | tail -3 | tr '\n' ' ')"
      - name: Receita - velocidade (100 MB)
        run: |
          M=$(grep -o '[0-9]\{4\}-[0-9]\{2\}' lista.xml | sort -u | tail -1); echo "mes $M"
          curl -sS -m 300 -u 'YggdBLfdninEJX9:' -r 0-104857599 "https://arquivos.receitafederal.gov.br/public.php/dav/files/YggdBLfdninEJX9/$M/Estabelecimentos0.zip" -o /dev/null -w '::notice::download HTTP %{http_code} %{size_download} bytes em %{time_total}s (%{speed_download} B/s)\n' || true
      - name: Site AMELIE
        run: curl -sS -m 30 -o /dev/null -w '::notice::site HTTP %{http_code} em %{time_total}s\n' https://amelieapp.com.br/robots.txt || true
      - name: Recursos
        run: echo "::notice::cpu $(nproc) mem $(free -g | awk '/Mem/{print $2}')G disco $(df -h / | awk 'NR==2{print $4}')"
